name = "cfwokerblog"
main = "src/worker.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# ============================================
# 静态资源配置
# ============================================
[assets]
directory = "./public"
binding = "ASSETS"
# 静态资源优先：public/ 下确实存在的文件由 Cloudflare 边缘直接返回，不经过 Worker。
# 原写法 serve_directly = false 是 wrangler v3 的字段，v4 已移除且被静默忽略
# （部署时报 Unexpected fields found in assets field），所以线上实际行为一直就是这里的效果。
# 不需要改成 Worker 优先的原因：handleAsset() 原样返回 env.ASSETS.fetch() 的结果，
# 并不给静态资源附加任何安全头；而 /icon/、/vendor/ 等路径本就豁免全站密码门禁。
# 若将来要让静态资源也过一遍 Worker（补安全头、复用 isStaticPath 逻辑），
# 改为 run_worker_first = true 即可，代价是每个图标 / JS 请求都消耗一次 Worker 调用。
run_worker_first = false

# ============================================
# D1 数据库绑定
# ============================================
# 使用 database_name（按名查找，无需写死 database_id）：
#   - Git 自动部署时 wrangler.toml 自带此绑定，部署后 env.DB 自动连上，无需每次在 Dashboard 手动重新绑定；
#   - 不写死 UUID，跨账号/跨环境也不会报「database_id 不存在」的错。
# 前提：Cloudflare 账号下已存在名为 blog-db 的 D1 数据库（binding 名必须与环境变量 env.DB 一致）。
[[d1_databases]]
binding = "DB"
database_name = "blog-db"


# CORS 配置已迁移至后台网站设置中
# [vars]
# ALLOWED_ORIGIN = "*"

[observability]
enabled = true

[observability.logs]
enabled = true
persist = true
invocation_logs = true
