name = "cloudflareblog"
main = "src/worker.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# ============================================
# 静态资源配置
# ============================================
[assets]
directory = "./public"
binding = "ASSETS"
serve_directly = false

# ============================================
# D1 数据库绑定
# ============================================
#    生产环境（Cloudflare 自动部署）无需在此写死 database_id：
#   请在 Cloudflare Dashboard 绑定一次即可（Settings → Bindings → Add → D1 Database），
#   变量名填 DB，选择你已有的 blog-db。绑定信息保存在 Cloudflare 侧，与仓库无关，
#   因此重新同步上游 / 重新创建数据库都不会再触发「需手动修改 wrangler.toml」的报错。
#
#   本地开发（可选）：取消下方注释并填入本地 D1 的 database_id，或直接使用 wrangler dev --local
# [[d1_databases]]
# binding = "DB"
# database_name = "blog-db"
# database_id = "本地开发的-database-id"


# CORS 配置已迁移至后台网站设置中
# [vars]
# ALLOWED_ORIGIN = "*"

[observability]
enabled = true

[observability.logs]
enabled = true
persist = true
invocation_logs = true
