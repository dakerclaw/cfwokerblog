name = "cloudflareblog"
main = "src/worker.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# ============================================
# 静态资源配置
# ============================================
[assets]
directory = "./public"
binding = "ASSETS"
serve_directly = false

# ============================================
# D1 数据库绑定
# ============================================
# 使用 database_name（按名查找，无需写死 database_id）：
#   - Git 自动部署时 wrangler.toml 自带此绑定，部署后 env.DB 自动连上，无需每次在 Dashboard 手动重新绑定；
#   - 不写死 UUID，跨账号/跨环境也不会报「database_id 不存在」的错。
# 前提：Cloudflare 账号下已存在名为 blog-db 的 D1 数据库（binding 名必须与环境变量 env.DB 一致）。
[[d1_databases]]
binding = "DB"
database_name = "blog-db"


# CORS 配置已迁移至后台网站设置中
# [vars]
# ALLOWED_ORIGIN = "*"

[observability]
enabled = true

[observability.logs]
enabled = true
persist = true
invocation_logs = true
